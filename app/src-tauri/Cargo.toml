[package]
name = "choimanga"
version = "0.1.0"
description = "일본 만화 그림의 일본어를 PC 안에서 읽고 번역해 한국어로 덮어 주는 개인용 앱"
authors = ["choidevhi"]
edition = "2024"
license = "MIT"

[lib]
name = "choimanga_lib"
crate-type = ["rlib"]

[[bin]]
name = "choimanga"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
